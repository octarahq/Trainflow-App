<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Trainflow</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trainflow" />
    <link rel="apple-touch-icon" href="icon.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1d2026;
      }
      #leaflet-map {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background-color: #1d2026;
      }
      #ComposeTarget {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      #loading-splash {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #1d2026;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: sans-serif;
        transition: opacity 0.5s ease-out;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #3498db;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      (function() {
        function isAbortError(err) {
          if (!err) return false;
          var str = String(err);
          var msg = String(err.message || '');
          var name = String(err.name || '');
          return str.includes('Abort') || str.includes('aborted') ||
                 msg.includes('Abort') || msg.includes('aborted') ||
                 name.includes('Abort') || name.includes('aborted');
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isAbortError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isAbortError(event.message) || isAbortError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="loading-splash">
      <div class="spinner"></div>
      <h2>Chargement de Trainflow...</h2>
      <p style="opacity: 0.6; font-size: 14px;">Premier lancement en cours</p>
    </div>
    <div id="leaflet-map"></div>
    <canvas id="ComposeTarget"></canvas>
    <script>
      window.tileCache = {};
      window.tileStatus = {};

      window.getTileData = function(z, x, y) {
        var key = z + '/' + x + '/' + y;
        if (window.tileCache[key]) {
          return window.tileCache[key];
        }
        if (!window.tileStatus[key]) {
          window.tileStatus[key] = true;
          var url = 'https://a.basemaps.cartocdn.com/dark_all/' + z + '/' + x + '/' + y + '.png';
          fetch(url)
            .then(function(res) { return res.arrayBuffer(); })
            .then(function(buf) {
              window.tileCache[key] = new Uint8Array(buf);
            })
            .catch(function() {});
        }
        return null;
      };

      window.trainflowMap = {
        map: null,
        init: function(lat, lon, zoom) {
          if (this.map) return;
          var container = document.getElementById('leaflet-map');
          if (!container || typeof L === 'undefined') return;
          this.map = L.map('leaflet-map', {
            center: [lat, lon],
            zoom: zoom,
            zoomControl: false,
            attributionControl: false
          });

          L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd',
            attribution: '&copy; OpenStreetMap &copy; CARTO'
          }).addTo(this.map);
        },
        setView: function(lat, lon, zoom) {
          if (this.map) {
            this.map.setView([lat, lon], zoom, { animate: false });
          }
        }
      };

      window.railSegments = null;
      (function loadRailShapes() {
        var urls = [
          '/shapes/lignes_sncf.geojson'
        ];
        function tryFetch(index) {
          if (index >= urls.length) return;
          fetch(urls[index])
            .then(function(res) { return res.json(); })
            .then(function(geojson) {
              if (geojson && geojson.features) {
                var list = [];
                geojson.features.forEach(function(feat) {
                  if (!feat.geometry) return;
                  var geom = feat.geometry;
                  if (geom.type === 'LineString') {
                    var c = geom.coordinates;
                    for (var i = 0; i < c.length - 1; i++) {
                      list.push(c[i][1], c[i][0], c[i+1][1], c[i+1][0]);
                    }
                  } else if (geom.type === 'MultiLineString') {
                    geom.coordinates.forEach(function(line) {
                      for (var i = 0; i < line.length - 1; i++) {
                        list.push(line[i][1], line[i][0], line[i+1][1], line[i+1][0]);
                      }
                    });
                  }
                });
                window.railSegments = new Float64Array(list);
              }
            })
            .catch(function() { tryFetch(index + 1); });
        }
        tryFetch(0);
      })();

      window.requestNotificationPermission = function() {
        if ("Notification" in window) {
          Notification.requestPermission();
        }
      };

      window.sendLocalNotification = function(title, body) {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification(title, {
            body: body
          });
        }
      };

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              registration.unregister();
              console.log('ServiceWorker unregistered successfully.');
            }
          });
        });
      }
    </script>
    <script type="application/javascript" src="trainflowApp.js"></script>
  </body>
</html>
