name: Build and Release Signed AAB and APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo $ENCODED_STRING | base64 -di > release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        if: github.event.release.prerelease == false
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build PWA
        if: github.event.release.prerelease == false
        run: ./gradlew :app:wasmJsBrowserDistribution

      - name: Setup Node.js (For Orion Deploy)
        if: github.event.release.prerelease == false
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install Orion CLI
        if: github.event.release.prerelease == false
        run: npm i -g @orionhosting/cli@latest

      - name: Deploy PWA to Orion
        if: github.event.release.prerelease == false
        run: orion deploy
        env:
          ORION_TOKEN: ${{ secrets.ORION_TOKEN }}
          ORION_SERVER_ID: ${{ vars.ORION_SERVER_ID }}

      - name: Prepare Artifacts
        id: prep
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="release"
          fi
          
          # APK (Toujours généré)
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_FILENAME="trainflow-${TAG_NAME}.apk"
          cp "$APK_PATH" "$APK_FILENAME"
          echo "apk_filename=$APK_FILENAME" >> $GITHUB_OUTPUT
          
          # AAB (Seulement pour les full releases)
          if [ "${{ github.event.release.prerelease }}" == "false" ]; then
            AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
            AAB_FILENAME="trainflow-${TAG_NAME}.aab"
            cp "$AAB_PATH" "$AAB_FILENAME"
            echo "aab_filename=$AAB_FILENAME" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.prep.outputs.apk_filename }}
            ${{ steps.prep.outputs.aab_filename }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



